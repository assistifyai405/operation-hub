# Canonical local full-stack (closed beta / release gate)
#
#   docker compose build
#   docker compose up --force-recreate
#   # or: docker compose up --build --force-recreate
#
# Services: frontend, backend, mongo, redis, worker, scheduler
# Verify: python scripts/check_local_release.py
# See: docs/CLOSED_BETA_RUNBOOK.md
#
# Pass a real key at runtime (never commit secrets):
#   export OPENAI_API_KEY=sk-...
# Do not weaken production config — this file is local/dev only.

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: assistify
      # Local-only secret — rejected in ENVIRONMENT=production
      JWT_SECRET: local-dev-secret-change-me-32chars!!
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:8000
      REDIS_URL: redis://redis:6379/0
      # API must enable workers so enqueue uses Redis (not silent sync fallback).
      # Actual processing still runs in the worker/scheduler containers + heartbeats.
      WORKER_ENABLED: "true"
      SCHEDULER_ENABLED: "true"
      REQUIRE_REDIS: "true"
      EMAIL_PROVIDER: console
      EMAIL_SENDING_ENABLED: "false"
      AI_PROVIDER: openai
      # Pass host key at runtime — never hardcode sk-test in Docker services.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STORAGE_PROVIDER: local
      ENABLE_DEMO_SEED: "false"
      ENABLE_DEMO_LOGIN: "false"
      BETA_MODE: "true"
      AI_DAILY_REQUEST_LIMIT: "200"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "jobs.worker"]
    environment:
      ENVIRONMENT: development
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: assistify
      JWT_SECRET: local-dev-secret-change-me-32chars!!
      REDIS_URL: redis://redis:6379/0
      WORKER_ENABLED: "true"
      REQUIRE_REDIS: "true"
      EMAIL_PROVIDER: console
      AI_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STORAGE_PROVIDER: local
      ENABLE_DEMO_SEED: "false"
      ENABLE_DEMO_LOGIN: "false"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from jobs.heartbeats import read_status; import sys; sys.exit(0 if read_status('worker').get('status')=='running' else 1)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  scheduler:
    build:
      context: ./backend
    command: ["python", "-m", "jobs.scheduler"]
    environment:
      ENVIRONMENT: development
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: assistify
      JWT_SECRET: local-dev-secret-change-me-32chars!!
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_ENABLED: "true"
      WORKER_ENABLED: "true"
      REQUIRE_REDIS: "true"
      EMAIL_PROVIDER: console
      AI_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STORAGE_PROVIDER: local
      ENABLE_DEMO_SEED: "false"
      ENABLE_DEMO_LOGIN: "false"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from jobs.heartbeats import read_status; import sys; sys.exit(0 if read_status('scheduler').get('status')=='running' else 1)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8000
        REACT_APP_BILLING_ENABLED: "false"
        REACT_APP_ENABLE_DEMO_LOGIN: "false"
        REACT_APP_BETA_MODE: "true"
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
