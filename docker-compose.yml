# Local full-stack development (Mongo + Redis included)
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: assistify
      JWT_SECRET: local-dev-secret-change-me-32chars!!
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379/0
      EMAIL_PROVIDER: console
      EMAIL_SENDING_ENABLED: "false"
      AI_PROVIDER: openai
      OPENAI_API_KEY: sk-test-not-used
      STORAGE_PROVIDER: local
      WORKER_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      ENABLE_DEMO_SEED: "false"
      ENABLE_DEMO_LOGIN: "false"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "jobs.worker"]
    environment:
      ENVIRONMENT: development
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: assistify
      JWT_SECRET: local-dev-secret-change-me-32chars!!
      REDIS_URL: redis://redis:6379/0
      WORKER_ENABLED: "true"
      EMAIL_PROVIDER: console
      AI_PROVIDER: openai
      OPENAI_API_KEY: sk-test-not-used
      STORAGE_PROVIDER: local
    depends_on:
      - backend
      - redis

  scheduler:
    build:
      context: ./backend
    command: ["python", "-m", "jobs.scheduler"]
    environment:
      ENVIRONMENT: development
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: assistify
      JWT_SECRET: local-dev-secret-change-me-32chars!!
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_ENABLED: "true"
      WORKER_ENABLED: "true"
      EMAIL_PROVIDER: console
      AI_PROVIDER: openai
      OPENAI_API_KEY: sk-test-not-used
      STORAGE_PROVIDER: local
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8000
        REACT_APP_BILLING_ENABLED: "false"
        REACT_APP_ENABLE_DEMO_LOGIN: "false"
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
