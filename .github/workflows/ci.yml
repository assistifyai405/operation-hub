name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          pip install 'redis>=5.0.0'
      - name: Compile / import check
        working-directory: backend
        run: |
          . .venv/bin/activate
          python -m compileall -q .
          python -c "import indexes, redis_client, rate_limit, distributed_locks, jobs, observability, errors"
      - name: Secret scan (basic)
        run: |
          if git grep -nE 'BEGIN (RSA |OPENSSH )?PRIVATE KEY|sk_live_|AKIA[0-9A-Z]{16}' -- ':!.github' ':!**/node_modules/**' ; then
            echo "Possible secrets found"; exit 1;
          fi
          echo "No high-confidence secrets matched"
      - name: Pytest Sprint 12–18
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: assistify_ci
          JWT_SECRET: unit-test-secret-key-with-32plus-chars!!
          ENVIRONMENT: development
          EMAIL_PROVIDER: console
          AI_PROVIDER: openai
          OPENAI_API_KEY: sk-test-key
          STORAGE_PROVIDER: local
          CORS_ORIGINS: http://localhost:3000
        run: |
          . .venv/bin/activate
          pytest tests/test_sprint12_hardening.py tests/test_sprint12_http.py \
            tests/test_sprint13_team.py tests/test_sprint14_email.py \
            tests/test_sprint15_integrations.py tests/test_sprint16_inbox.py \
            tests/test_sprint17_native_send.py tests/test_sprint18_ops.py \
            -n 0 -q --tb=line

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install & build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8000
        run: |
          yarn install --frozen-lockfile
          yarn build

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose -f docker-compose.yml config
      - name: Build backend image
        run: docker build -t assistify-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t assistify-frontend:ci --build-arg REACT_APP_BACKEND_URL=http://localhost:8000 ./frontend
